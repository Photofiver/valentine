<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickPrice</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
    input { width: 100%; padding: 12px; font-size: 18px; margin-bottom: 12px; }
    button { width: 100%; padding: 14px; font-size: 18px; background: #0066ff; color: white; border: none; border-radius: 8px; }
    .info { color: #666; font-size: 14px; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>QuickPrice</h1>
  <p>Sprawdź ceny na CEX i eBay (w tym sprzedane)</p>
  
  <input type="text" id="item" placeholder="Wpisz nazwę rzeczy (np. iPhone 13, PS5)">
  <button onclick="checkPrices()">Sprawdź ceny</button>

  <div class="info">
    Otworzy 3 karty: CEX + eBay aktualne + eBay sprzedane
  </div>

  <script>
    function checkPrices() {
      const item = document.getElementById('item').value.trim();
      if (!item) {
        alert('Wpisz nazwę rzeczy');
        return;
      }

      const q = encodeURIComponent(item);

      // CEX
      window.open(`https://uk.webuy.com/search?stext=${q}`, '_blank');
      
      // eBay aktualne
      window.open(`https://www.ebay.co.uk/sch/i.html?_nkw=${q}&_sacat=0`, '_blank');
      
      // eBay sprzedane
      window.open(`https://www.ebay.co.uk/sch/i.html?_nkw=${q}&LH_Sold=1&LH_Complete=1&_sop=13`, '_blank');
    }

    // Enter key support
    document.getElementById('item').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') checkPrices();
    });
  </script>
</body>
</html>
