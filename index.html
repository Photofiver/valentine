<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickPrice - Zdjęcie → Ceny</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 20px; background: #f8f9fa; }
        h1 { text-align: center; color: #333; }
        .container { max-width: 600px; margin: 0 auto; }
        #drop-zone {
            border: 3px dashed #0066ff;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            background: white;
            cursor: pointer;
            margin-bottom: 20px;
        }
        #drop-zone:hover { background: #f0f8ff; }
        img { max-width: 100%; border-radius: 8px; margin: 15px 0; }
        button {
            background: #0066ff;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            width: 100%;
            margin: 10px 0;
        }
        .note { text-align: center; color: #666; font-size: 14px; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>QuickPrice</h1>
        <p style="text-align:center; color:#666;">Wrzuć zdjęcie rzeczy → automatycznie sprawdzam ceny CEX + eBay sprzedane</p>

        <div id="drop-zone">
            <p>Wrzuć lub zrób zdjęcie</p>
            <input type="file" id="file-input" accept="image/*" capture="environment" style="display:none;">
        </div>

        <div id="preview"></div>

        <button onclick="openCEX()">🛒 Otwórz CEX UK</button>
        <button onclick="openEbayCurrent()">📦 Otwórz eBay UK (aktualne)</button>
        <button onclick="openEbaySold()">💰 Otwórz eBay UK SPRZEDANE</button>

        <div class="note">
            Wrzuć zdjęcie, zobacz co to jest i kliknij przycisk – dostaniesz ceny bez wpisywania nazwy.<br>
            (Dla automatycznego rozpoznawania wrzuć zdjęcie do Grok w czacie)
        </div>
    </div>

    <script>
        // Handle file upload
        document.getElementById('drop-zone').addEventListener('click', () => {
            document.getElementById('file-input').click();
        });

        document.getElementById('file-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(ev) {
                    showPreview(ev.target.result);
                };
                reader.readAsDataURL(file);
            }
        });

        function showPreview(src) {
            const preview = document.getElementById('preview');
            preview.innerHTML = `<img src="${src}" style="max-width:100%; border-radius:8px;">`;
        }

        function openCEX() {
            window.open('https://uk.webuy.com/search?stext=', '_blank');
        }

        function openEbayCurrent() {
            window.open('https://www.ebay.co.uk/sch/i.html?_nkw=&_sacat=0', '_blank');
        }

        function openEbaySold() {
            window.open('https://www.ebay.co.uk/sch/i.html?_nkw=&LH_Sold=1&LH_Complete=1&_sop=13', '_blank');
        }
    </script>
</body>
</html>
