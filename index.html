<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickPrice</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; padding: 20px; background: #f8f9fa; text-align: center; }
        h1 { color: #0066ff; }
        #drop-zone {
            border: 4px dashed #0066ff;
            border-radius: 20px;
            padding: 60px 20px;
            margin: 30px auto;
            max-width: 500px;
            background: white;
            cursor: pointer;
        }
        #drop-zone:hover { background: #f0f8ff; }
        img { max-width: 100%; border-radius: 12px; margin-top: 20px; }
        .note { color: #666; font-size: 15px; margin-top: 30px; }
    </style>
</head>
<body>
    <h1>QuickPrice</h1>
    <p style="color:#0066ff;">Zeskanuj kod lub wrzuć zdjęcie → automatycznie CEX + eBay sold</p>

    <div id="drop-zone">
        <p>Wrzuć zdjęcie lub zeskanuj kod</p>
        <input type="file" id="file-input" accept="image/*" capture="environment" style="display:none;">
    </div>

    <div id="preview"></div>

    <div class="note">
        Po wrzuceniu zdjęcia automatycznie otworzy CEX UK + eBay aktualne + eBay sprzedane
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const preview = document.getElementById('preview');

        dropZone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    preview.innerHTML = `<img src="${ev.target.result}">`;
                    // Automatycznie otwiera linki
                    window.open('https://uk.webuy.com/search?stext=', '_blank');
                    window.open('https://www.ebay.co.uk/sch/i.html?_nkw=&_sacat=0', '_blank');
                    window.open('https://www.ebay.co.uk/sch/i.html?_nkw=&LH_Sold=1&LH_Complete=1&_sop=13', '_blank');
                };
                reader.readAsDataURL(file);
            }
        });

        // Drag and drop support
        dropZone.addEventListener('dragover', (e) => e.preventDefault());
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            const file = e.dataTransfer.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    preview.innerHTML = `<img src="${ev.target.result}">`;
                    window.open('https://uk.webuy.com/search?stext=', '_blank');
                    window.open('https://www.ebay.co.uk/sch/i.html?_nkw=&_sacat=0', '_blank');
                    window.open('https://www.ebay.co.uk/sch/i.html?_nkw=&LH_Sold=1&LH_Complete=1&_sop=13', '_blank');
                };
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
