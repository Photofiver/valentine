<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickPrice - Zdjęcie → Ceny</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 20px; background: #f8f9fa; }
        h1 { text-align: center; color: #333; }
        .container { max-width: 600px; margin: 0 auto; }
        #drop-zone {
            border: 3px dashed #0066ff;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            background: white;
            cursor: pointer;
            margin-bottom: 20px;
        }
        #drop-zone:hover { background: #f0f8ff; }
        img { max-width: 100%; border-radius: 8px; margin: 15px 0; }
        button {
            background: #0066ff;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            width: 100%;
            margin: 10px 0;
        }
        .results { margin-top: 20px; }
        .detected { background: white; padding: 15px; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>QuickPrice</h1>
        <p style="text-align:center; color:#666;">Wrzuć zdjęcie rzeczy → automatycznie sprawdzam ceny CEX + eBay sprzedane</p>

        <div id="drop-zone">
            <p>Wrzuć lub zrób zdjęcie</p>
            <input type="file" id="file-input" accept="image/*" capture="environment" style="display:none;">
        </div>

        <div id="preview"></div>

        <button onclick="analyzeImage()">🔍 Analizuj zdjęcie i sprawdź ceny</button>

        <div id="results" class="results"></div>
    </div>

    <script>
        let model = null;
        let currentImage = null;

        async function loadModel() {
            if (model) return model;
            try {
                const resultsDiv = document.getElementById('results');
                resultsDiv.innerHTML = '<p>Ładuję model AI (pierwszy raz trwa dłużej)...</p>';
                model = await cocoSsd.load();
                console.log('✅ Model COCO-SSD załadowany');
                resultsDiv.innerHTML = '';
                return model;
            } catch (e) {
                console.error(e);
                const resultsDiv = document.getElementById('results');
                resultsDiv.innerHTML = '<p style="color:red">Błąd ładowania modelu. Spróbuj odświeżyć stronę.</p>';
                throw e;
            }
        }

        // Handle file upload
        document.getElementById('drop-zone').addEventListener('click', () => {
            document.getElementById('file-input').click();
        });

        document.getElementById('file-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(ev) {
                    currentImage = ev.target.result;
                    showPreview(currentImage);
                };
                reader.readAsDataURL(file);
            }
        });

        function showPreview(src) {
            const preview = document.getElementById('preview');
            preview.innerHTML = `<img src="${src}" id="image-preview" style="max-width:100%">`;
        }

        async function analyzeImage() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p>Analizuję zdjęcie...</p>';

            const img = document.getElementById('image-preview');
            if (!img) {
                resultsDiv.innerHTML = '<p style="color:red">Najpierw wrzuć zdjęcie!</p>';
                return;
            }

            try {
                await loadModel();

                if (!model || typeof model.detect !== 'function') {
                    throw new Error('Model nie jest gotowy');
                }

                const predictions = await model.detect(img);
                
                if (predictions.length === 0) {
                    resultsDiv.innerHTML = '<p>Nie wykryto przedmiotów. Spróbuj inne zdjęcie lub lepsze oświetlenie.</p>';
                    return;
                }

                // Najlepsze wykrycie
                predictions.sort((a, b) => b.score - a.score);
                const top = predictions[0];
                const label = top.class;

                resultsDiv.innerHTML = `
                    <div class="detected">
                        <strong>Wykryto:</strong> ${label} (pewność: ${(top.score*100).toFixed(0)}%)<br>
                        Otwieram CEX + eBay sprzedane...
                    </div>
                `;

                const query = encodeURIComponent(label);
                
                window.open(`https://uk.webuy.com/search?stext=${query}`, '_blank');
                window.open(`https://www.ebay.co.uk/sch/i.html?_nkw=${query}`, '_blank');
                window.open(`https://www.ebay.co.uk/sch/i.html?_nkw=${query}&LH_Sold=1&LH_Complete=1&_sop=13`, '_blank');

            } catch (error) {
                console.error(error);
                resultsDiv.innerHTML = `<p style="color:red">Błąd: ${error.message || 'Nie udało się wykryć przedmiotu'}</p>`;
            }
        }

        // Auto load on page load
        window.onload = async () => {
            try {
                await loadModel();
            } catch (e) {}
        };
    </script>
</body>
</html>
